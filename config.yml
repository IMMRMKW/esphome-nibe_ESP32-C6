substitutions:
  wifi_ssid: "YourSSID"  # Default value, can be overridden via -s flag
  wifi_password: "YourPassword"  # Default value, can be overridden via -s flag
  ha_ip: "192.168.1.100"  # Default Home Assistant IP, can be overridden via -s flag

esphome:
  name: espnibe
  friendly_name: NIBE_ESP
  platformio_options:
    board: "esp32-c6-devkitc-1"
    framework: "arduino"
    platform: https://github.com/platformio/platform-espressif32.git#develop
    lib_deps:
      - "https://github.com/ESP32Async/AsyncTCP.git"
      - "https://github.com/ESP32Async/ESPAsyncWebServer.git"
    lib_extra_dirs:
      - ".esphome\\build\\espnibe\\.piolibdeps\\AsyncTCP-esphome\\"
      - ".esphome\\build\\espnibe\\.piolibdeps\\ESPAsyncWebserver-esphome\\"
    lib_ignore:
      - "AsyncTCP-esphome"
      - "ESPAsyncWebServer-esphome"
    lib_ldf_mode: deep
    platform_packages:
      - framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.2
      - framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.2/esp32-arduino-libs-3.0.2.zip
    
    build_flags:
     - -D ARDUINO_USB_MODE=1
     - -D USE_LOGGER_USB_SERIAL_JTAG=1

esp32:
  board: esp32-c3-devkitc-1
  flash_size: 4MB
  variant: ESP32C6
  framework:
    type: arduino   

external_components:
  # - source: 
  #     type: local
  #     path: components
  #   components:
  #     - nibegw
  - source: 
      type: git
      url: https://github.com/elupus/esphome-nibe



# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: "espnibe_pass"

# Enable Improv via Serial for WiFi configuration
improv_serial:

wifi:
  # WiFi credentials can be:
  # 1. Provided via substitutions during compile (GitHub Actions): use ${wifi_ssid} and ${wifi_password}
  # 2. Left empty to use Improv Serial after flashing
  # 3. Set via captive portal if connection fails
  ssid: ${wifi_ssid}
  password: ${wifi_password}

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "espnibe"
    password: "bJhPXchn93Ux"

captive_portal:

# Web server for configuration
web_server:
  port: 80

# Global variable to store Home Assistant IP
globals:
  - id: ha_ip_address
    type: std::string
    initial_value: '"${ha_ip}"'

# Text input to configure Home Assistant IP
text:
  - platform: template
    name: "Home Assistant IP"
    id: ha_ip_text
    optimistic: true
    initial_value: "${ha_ip}"
    mode: text
    entity_category: config
    on_value:
      then:
        - globals.set:
            id: ha_ip_address
            value: !lambda 'return x;'
        - logger.log:
            format: "Home Assistant IP updated to: %s"
            args: ['x.c_str()']

output:
  # Heartbeat status LED
  - platform: gpio
    id: statusLED
    pin: GPIO19
  - platform: gpio
    id: ENABLE_PIN # Enable the chip
    pin:
      number: GPIO5
      inverted: true
  - platform: gpio
    id: SHDN_PIN # Enable the chip
    pin:
      number: GPIO4
      inverted: true

interval:
  - interval: 10000ms
    then:
      - output.turn_on: statusLED
      - delay: 100ms
      - output.turn_off: statusLED

uart:
  id: nibe_uart
  rx_pin: GPIO6
  tx_pin: GPIO7
  baud_rate: 9600

nibegw:
#   dir_pin:
#     number: GPIO4
#     inverted: false

  # If you have a named uart instance, you can specify this here.
  uart_id: nibe_uart

  udp:
    # The target address(s) to send data to. May also be multicast addresses.
    # Can be set via substitutions during compile or changed later via Home Assistant
    target:
      - ip: ${ha_ip}
        port: 9999
    source:
      - ${ha_ip}
    # # List of source address to accept read/write from, may be empty for no filter, but
    # # this is not recommended.
    # source:
    #   - 192.168.16.130

    # # Optional port this device will listen to to receive read requests. Defaults to 9999
    read_port: 9999

    # # Optional port this device will listen to to receive write request. Defaults to 10000
    write_port: 10000


  acknowledge:
    - MODBUS40

    # Enable a dummy RMU40 accessory to receive updates
    # to certain registers faster. This should not be
    # enabled if you have an actual RMU40.
    - RMU40_S4

  # Constant replies to certain requests can be made
  constants:
    - address: MODBUS40
      token: ACCESSORY
      data: [
            0x0A, # MODBUS version low
            0x00, # MODBUS version high
            0x02, # MODBUS address?
      ]

    # Accessory version response
    - address: RMU40_S4
      token: ACCESSORY
      data: [
            0xEE, # RMU ?
            0x03, # RMU version low
            0x01, # RMU version high
      ]

    # Unknown response that nibepi uses
    - address: RMU40_S4
      token: RMU_DATA
      command: RMU_WRITE
      data: [
            0x63,
            0x00,
      ]

    # Constant fixed temperature to avoid pump going into alarm.
    - address: RMU40_S4
      token: RMU_WRITE
      data: [
            0x06, # Temperature
            0x14, # degrees low
            0x00, # degrees high
      ]

