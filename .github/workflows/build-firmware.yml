name: Build ESPHome Firmware

on:
  push:
    branches:
      - github-compilation
  workflow_dispatch:
    inputs:
      ha_ip:
        description: 'Home Assistant IP Address'
        required: true
        default: '192.168.1.100'
      api_key:
        description: 'API Encryption Key (base64, 32 bytes)'
        required: true
        default: 'Hcbp/oa8VWQlhAf43Wk14DNFKqqNPyOP2ZOKlPQNpNg='

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install ESPHome
        run: pip install -e ./esphome
        
      - name: Setup custom board
        run: |
          mkdir -p ~/.platformio/boards
          cp boards/elecram_esp32-c6.json ~/.platformio/boards/
        
      - name: Compile firmware
        env:
          HA_IP: ${{ github.event.inputs.ha_ip || '192.168.1.100' }}
          API_KEY: ${{ github.event.inputs.api_key }}
        run: esphome -s ha_ip "${HA_IP}" -s api_key "${API_KEY}" compile config.yml
      
      - name: Rename factory image
        run: cp .esphome/build/espnibe/.pioenvs/espnibe/firmware.factory.bin .esphome/build/espnibe/.pioenvs/espnibe/nibe-esp32-c6.bin
            
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: espnibe-firmware
          retention-days: 1
          path: |
            .esphome/build/espnibe/.pioenvs/espnibe/nibe-esp32-c6.bin
            .esphome/build/espnibe/.pioenvs/espnibe/firmware.bin
            .esphome/build/espnibe/.pioenvs/espnibe/firmware.elf
            .esphome/build/espnibe/.pioenvs/espnibe/bootloader.bin
            .esphome/build/espnibe/.pioenvs/espnibe/partitions.bin
          if-no-files-found: warn
