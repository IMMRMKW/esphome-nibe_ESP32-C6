name: Build ESPHome Firmware

on:
  push:
    branches:
      - github-compilation
  workflow_dispatch:
    inputs:
      ha_ip:
        description: 'Home Assistant IP Address'
        required: true
        default: '192.168.1.100'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install ESPHome
        run: pip install esphome
        
      - name: Compile firmware
        env:
          HA_IP: ${{ github.event.inputs.ha_ip || '192.168.1.100' }}
          PLATFORMIO_BOARDS_DIR: ${{ github.workspace }}
        run: |
          esphome -s ha_ip "${HA_IP}" compile config.yml
            
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: espnibe-firmware
          path: |
            .esphome/build/espnibe/.pioenvs/espnibe/firmware.bin
            .esphome/build/espnibe/.pioenvs/espnibe/firmware.elf
          if-no-files-found: error
