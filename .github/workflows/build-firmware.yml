name: Build ESPHome Firmware

on:
  push:
    branches:
      - github-compilation
  workflow_dispatch:
    inputs:
      ha_ip:
        description: 'Home Assistant IP Address'
        required: true
        default: '192.168.1.100'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install ESPHome
        run: pip install esphome
        
      - name: Setup custom board directory
        run: |
          # Create boards directory in HOME so PlatformIO finds it
          mkdir -p ~/.platformio/boards
          cp boards/elecram_esp32-c6.json ~/.platformio/boards/
          echo "✅ Board file copied to: ~/.platformio/boards/"
          echo "Board file content check:"
          ls -la ~/.platformio/boards/
          cat ~/.platformio/boards/elecram_esp32-c6.json
        
      - name: Verify PlatformIO can see custom board
        run: |
          echo "🔍 Testing if PlatformIO recognizes the custom board..."
          pip install platformio
          set +e
          platformio boards elecram_esp32-c6
          BOARD_CHECK=$?
          set -e
          if [ $BOARD_CHECK -ne 0 ]; then
            echo "⚠️ Board not found by PlatformIO! This is expected - ESPHome will use the board file directly."
          else
            echo "✅ Board found by PlatformIO!"
          fi
        
      - name: Compile firmware
        env:
          HA_IP: ${{ github.event.inputs.ha_ip || '192.168.1.100' }}
        run: |
          echo "🔍 Verifying board file before compile:"
          echo "Board file location: ~/.platformio/boards/elecram_esp32-c6.json"
          ls -la ~/.platformio/boards/elecram_esp32-c6.json
          echo "Starting compilation..."
          esphome -s ha_ip "${HA_IP}" compile config.yml
      
      - name: Show build output location
        run: |
          echo "Build directory structure:"
          ls -laR .esphome/build/espnibe/.pioenvs/ || echo "Build directory not found"
            
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: espnibe-firmware
          path: |
            .esphome/build/espnibe/.pioenvs/espnibe/firmware.bin
            .esphome/build/espnibe/.pioenvs/espnibe/firmware.elf
          if-no-files-found: error
